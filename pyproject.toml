[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quilr-assessment"
version = "0.1.0"
description = "MCP and LLM gateway assessment"
requires-python = ">=3.12"
dependencies = [
  "mcp==1.30.0", "fastapi==0.162.0", "httpx==0.28.1",
  "pydantic==2.14.3", "pydantic-settings==2.16.2", "PyJWT==2.15.1",
  "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "pytest-asyncio==1.4.1.post1", "ruff==0.17.4"]

[project.scripts]
customer-mcp = "quilr_assessment.mcp_server:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.hatch.build.targets.wheel]
packages = ["src/quilr_assessment"]
